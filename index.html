<!DOCTYPE html>
<html>

<head>

    <title>IoT Cloud Monitoring</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>☁️ IoT Cloud Monitoring System</h1>

    <div class="container">

        <div class="card">
            <h2>🌡️ Temperature</h2>
            <p id="temperature">-- °C</p>
        </div>

        <div class="card">
            <h2>💧 Humidity</h2>
            <p id="humidity">-- %</p>
        </div>

        <div class="card">
            <h2>🌫️ Air Quality</h2>
            <p id="air_quality">--</p>
        </div>

        <div class="card">
            <h2>📡 Device</h2>
            <p id="device">--</p>
        </div>

    </div>

    <h2>Latest Sensor Readings</h2>

    <table>

        <thead>

            <tr>
                <th>Device</th>
                <th>Temperature</th>
                <th>Humidity</th>
                <th>Air Quality</th>
                <th>Time</th>
            </tr>

        </thead>

        <tbody id="sensorTable">

        </tbody>

    </table>

    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
